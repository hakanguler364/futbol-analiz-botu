<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futbol Analiz Merkezi</title>
<style>
body{background:#0c1425;color:#edf2ff;font:16px system-ui;margin:0;padding:24px}
main{max-width:1000px;margin:auto}
h1{font-size:28px}
.muted{color:#aebcd2}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card,.match{background:#19263b;border:1px solid #30405b;border-radius:15px;padding:17px;margin:12px 0}
.num{font-size:32px;font-weight:750}
button{background:#2979ff;color:white;border:0;border-radius:9px;padding:11px;cursor:pointer;margin:5px}
button:disabled{opacity:.5}
input[type=date]{background:#19263b;color:white;border:1px solid #526785;border-radius:9px;padding:12px;font-size:16px;max-width:100%}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#aebcd2}
.error{color:#ffb5b5}
.good{color:#90e7ac}

body{background:radial-gradient(ellipse at top,#102a48 0%,#071321 60%);color:#f2f7ff;padding:12px;font-size:14px}
main{max-width:1180px}h1{font-size:clamp(21px,4vw,30px);text-align:center}
.card,.match{background:linear-gradient(160deg,#102942,#081a30);border:1px solid #254b70;border-radius:13px;padding:12px;box-shadow:0 4px 16px #0003}
.cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.num{font-size:22px}
button{font-size:12px;padding:8px 10px;margin:3px}
.match-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.analysis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.panel{min-width:0;background:linear-gradient(155deg,#112b47,#07182b);border:1px solid #28547a;border-radius:12px;padding:11px}
.panel h3{font-size:14px;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid #244562}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 2px;border-bottom:1px solid #1c3651;font-size:12px}
.metric b{font-size:14px}.score-green{color:#4bea8e}.score-yellow{color:#ffd25d}.score-red{color:#ff7c8c}
.bar-track{height:6px;background:#33465c;border-radius:10px;overflow:hidden;margin:4px 0 8px}
.bar-fill{height:100%;border-radius:10px}
.analysis-grid small{font-size:10px}.analysis-grid p{margin:6px 0}
.panel-wide{grid-column:span 2}
@media(max-width:700px){.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.panel{padding:8px}.panel h3{font-size:12px}.metric{font-size:11px}.panel-wide{grid-column:span 2}.cards .card{padding:7px;font-size:10px}.num{font-size:18px}}
@media(max-width:370px){.analysis-grid{grid-template-columns:1fr}.panel-wide{grid-column:span 1}}

/* Referans görsele yakın kompakt skor paneli */
.match{border:2px solid #244e75;background:linear-gradient(160deg,#0c2743,#071525);padding:12px}
.match-head{display:flex;align-items:center;justify-content:space-between}
.match-title{font-size:clamp(15px,2.5vw,23px);font-weight:800;color:#fff}
.match-title .versus{color:#8bb3d5;margin:0 10px}
.analysis-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.panel{border:2px solid #244f76;border-radius:15px;padding:11px;background:linear-gradient(165deg,#102b49,#071629)}
.panel h3{font-size:clamp(12px,1.5vw,17px);background:#102c4a;margin:-11px -11px 10px;padding:10px 11px;border-radius:12px 12px 0 0}
.metric{font-size:13px}.metric b{font-size:16px}
.score-pill{border:1px solid #207c63;background:#073b36;border-radius:10px;padding:5px 10px;color:#4af18c;font-size:20px;font-weight:800}
.team-versus{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 5px;margin:8px 0;border:1px solid #23486a;border-radius:12px;font-weight:800;font-size:clamp(15px,2.5vw,22px)}
.team-versus span:nth-child(2){color:#9db7d0}
.form-chip{display:inline-block;min-width:21px;text-align:center;border-radius:5px;padding:3px;margin:2px;font-size:11px;font-weight:800;color:white}
.form-win{background:#14a34a}.form-draw{background:#64748b}.form-loss{background:#bd3047}
@media(max-width:700px){.analysis-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.panel{padding:6px;border-radius:9px}.panel h3{font-size:10px;padding:7px 5px;margin:-6px -6px 6px}.metric{font-size:10px;gap:3px}.metric b{font-size:11px}.panel small{font-size:9px}.bar-track{height:5px}.match{padding:8px}.team-versus{font-size:12px}.score-pill{font-size:14px;padding:3px 6px}}
@media(max-width:430px){.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel:first-child{grid-column:1}.panel:nth-child(2){grid-column:2}.panel:nth-child(3){grid-column:span 2}.panel:nth-child(6){grid-column:span 2}}
</style>
</head>
<body>
<main>
<h1>⚽ Dünya Ligleri – Analiz Merkezi</h1>
<p class="muted" id="mode">Yükleniyor...</p>

<div class="card">
<label for="matchDate"><b>📅 Maç tarihini seç</b></label>
<p><input type="date" id="matchDate"></p>
<button onclick="today()">Günlük maçları getir</button>
</div>

<div class="cards">
<div class="card">Toplam maç<div class="num" id="total">0</div></div>
<div class="card">Analiz edilen<div class="num" id="analyzed">0</div></div>
<div class="card">Tamamlanan<div class="num" id="success">0</div></div>
<div class="card">Hatalı / eksik<div class="num" id="failed">0</div></div>
</div>

<button onclick="load()">Maçları yenile</button>
<button onclick="analyzeAll()">Analizleri yeniden hesapla</button>
<p id="progress" class="muted"></p>
<div class="card"><label for="leagueFilter"><b>🏆 Lig seç</b></label><p><select id="leagueFilter" onchange="renderGames()" style="background:#19263b;color:white;border:1px solid #526785;border-radius:9px;padding:12px;width:100%;max-width:450px"><option value="">Tüm ligler</option></select></p><p id="leagueSummary" class="muted"></p></div>
<p class="muted">Maçlar Türkiye saatine göre erken başlayandan geç başlayana sıralanır.</p><section id="matches"></section>

<h2>Analiz ayrıntıları</h2>
<div class="card">
<pre id="details">Bir maçın analizini başlatın.</pre>
</div>
</main>

<script>
let games=[],done=0,ok=0,bad=0,results={},runId=0;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));

const leagueTR={
'Turkish Super Lig':'Türkiye Süper Lig','Turkish Süper Lig':'Türkiye Süper Lig','Turkish 1. Lig':'Türkiye 1. Lig','Turkish Cup':'Türkiye Kupası',
'English Premier League':'İngiltere Premier Lig','Premier League':'İngiltere Premier Lig','English League Championship':'İngiltere Championship','English FA Cup':'İngiltere Federasyon Kupası','English Carabao Cup':'İngiltere Lig Kupası',
'Spanish LALIGA':'İspanya La Liga','Spanish LaLiga':'İspanya La Liga','Spanish Segunda División':'İspanya 2. Lig','Spanish Copa del Rey':'İspanya Kral Kupası',
'German Bundesliga':'Almanya Bundesliga','German 2. Bundesliga':'Almanya 2. Bundesliga','German DFB Pokal':'Almanya Kupası',
'Italian Serie A':'İtalya Serie A','Italian Serie B':'İtalya Serie B','Italian Coppa Italia':'İtalya Kupası',
'French Ligue 1':'Fransa Ligue 1','French Ligue 2':'Fransa Ligue 2',
'UEFA Champions League':'UEFA Şampiyonlar Ligi','UEFA Europa League':'UEFA Avrupa Ligi','UEFA Conference League':'UEFA Konferans Ligi','UEFA Nations League':'UEFA Uluslar Ligi',
'FIFA World Cup':'FIFA Dünya Kupası','International Friendly':'Hazırlık Maçı',
'Major League Soccer':'ABD MLS','Brazilian Serie A':'Brezilya Serie A','Argentine Liga Profesional de Fútbol':'Arjantin 1. Lig'
};
function kickoffTR(value){if(!value)return 'Saat bilinmiyor';const d=new Date(value);return Number.isNaN(d.getTime())?'Saat bilinmiyor':new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
function trLeague(name){const raw=String(name||'Bilinmeyen lig');return leagueTR[raw]||raw.replace(/^Turkish /,'Türkiye ').replace(/^English /,'İngiltere ').replace(/^Spanish /,'İspanya ').replace(/^German /,'Almanya ').replace(/^Italian /,'İtalya ').replace(/^French /,'Fransa ').replace(/^Portuguese /,'Portekiz ').replace(/^Dutch /,'Hollanda ').replace(/^Belgian /,'Belçika ').replace(/^Scottish /,'İskoçya ').replace(/^Brazilian /,'Brezilya ').replace(/^Argentine /,'Arjantin ').replace(/^Saudi /,'Suudi Arabistan ').replace(/^Japanese /,'Japonya ').replace(/^Korean /,'Güney Kore ').replace(/^Australian /,'Avustralya ');}
function localDate(){
const d=new Date();
return [
d.getFullYear(),
String(d.getMonth()+1).padStart(2,'0'),
String(d.getDate()).padStart(2,'0')
].join('-');
}

function today(){
el('matchDate').value=localDate();
load();
}

async function api(url,options){
const r=await fetch(url,options);
const j=await r.json();
if(!r.ok)throw Error(j.error||'Sunucu hatası');
return j;
}

function update(){
el('total').textContent=games.length;
el('analyzed').textContent=done;
el('success').textContent=ok;
el('failed').textContent=bad;
el('progress').textContent=`${done}/${games.length} maç işlendi`;
}

function renderGames(){
const selected=el('leagueFilter').value;
const filtered=games.filter(m=>!selected||(m.competition?.name||'Bilinmeyen lig')===selected).sort((a,b)=>new Date(a.utcDate||0)-new Date(b.utcDate||0));
el('matches').innerHTML=filtered.map(m=>`
<div class="match">
<div class="match-head"><b>🕒 ${esc(kickoffTR(m.utcDate))}</b><span class="muted">⚽ Maç Analizi</span></div><div class="team-versus"><span>${esc(m.homeTeam?.name)}</span><span>VS</span><span>${esc(m.awayTeam?.name)}</span></div>
<p class="muted">🏆 <b>${esc(trLeague(m.competition?.name))}</b> · Türkiye saati</p>
<button onclick="analyze('${esc(m.id)}')">Analiz et</button>
<button onclick="send('${esc(m.id)}')">Telegram'a gönder</button>
<div id="state-${esc(m.id)}" class="muted">Analiz bekleniyor</div>
</div>
`).join('')||'<p>Bu tarihlerde veri kaynağının kapsadığı maç bulunamadı.</p>';
update();
}
async function load(){
const date=el('matchDate').value;
if(!date){alert('Önce tarih seçin');return;}
el('mode').textContent='Maçlar yükleniyor...';
el('matches').textContent='';
runId++;games=[];done=ok=bad=0;results={};
update();

try{
const d=await api('/api/matches?date='+encodeURIComponent(date));
if(!Array.isArray(d.matches))throw Error('Geçersiz maç verisi');
games=d.matches.sort((a,b)=>new Date(a.utcDate||0)-new Date(b.utcDate||0));
const counts={};for(const m of games){const league=m.competition?.name||'Bilinmeyen lig';counts[league]=(counts[league]||0)+1;}
const leagueNames=Object.keys(counts).sort((a,b)=>trLeague(a).localeCompare(trLeague(b),'tr'));
el('leagueFilter').innerHTML='<option value="">Tüm ligler ('+games.length+' maç)</option>'+leagueNames.map(name=>'<option value="'+esc(name)+'">'+esc(trLeague(name))+' ('+counts[name]+' maç)</option>').join('');
el('leagueSummary').textContent='Yalnızca bu tarihte maç verisi gelen ligler gösterilir. Süper Lig dahil bir lig görünmüyorsa o gün maç olmayabilir veya veri kaynağı maçı getirmemiş olabilir. '+leagueNames.length+' lig / turnuva: '+leagueNames.map(name=>trLeague(name)+' ('+counts[name]+')').join(' · ');
el('mode').textContent=d.demo
?'DEMO MODU — gerçek veri için API anahtarı gerekli'
:'CANLI VERİ MODU — '+date;

renderGames();
analyzeAll();

}catch(e){
el('mode').textContent='Hata: '+e.message;
el('matches').textContent='Maçlar alınamadı.';
}
}

async function analyze(id){
try{
const r=await api('/api/analyze/'+id);
if(!results[id]){
done++;
if(r.status==='complete')ok++;
else bad++;
}
results[id]=r;
const state=el('state-'+id);
if(state){
const a=r.sections?.home_last5,b=r.sections?.away_last5;
const h=r.sections?.head_to_head_last10;

const color=p=>p>=75?'#34e981':p>=50?'#ffcf56':'#ff7889';
const scoreClass=p=>p>=75?'score-green':p>=50?'score-yellow':'score-red';
const metric=(label,value)=>'<div class="metric"><span>'+label+'</span><b>'+value+'</b></div>';
const bar=(label,p)=>{if(p===null)return metric(label,'Veri yok');const v=Math.max(0,Math.min(99,Math.round(p)));return '<div class="metric"><span>'+label+'</span><b class="'+scoreClass(v)+'">'+v+' puan</b></div><div class="bar-track"><div class="bar-fill" style="width:'+v+'%;background:'+color(v)+'"></div></div>';};
const valid=s=>s&&Number.isFinite(s.count)&&s.count>0;
const pct=(s,venue,field)=>{const games=(s?.games||[]).filter(g=>g.venue===venue&&Number.isFinite(g[field]));const fallback=(s?.games||[]).filter(g=>Number.isFinite(g[field]));const sample=games.length>=2?games:fallback;if(sample.length>=2)return Math.round(100*sample.filter(g=>g[field]>0).length/sample.length);if(!valid(s))return null;const full=field==='first_half_scored'?'scored':'conceded';return Math.round(100*(1-Math.exp(-.45*s[full]/s.count)));};
const venueHalf=(s,venue)=>{const g=(s?.games||[]).filter(x=>x.venue===venue&&Number.isFinite(x.first_half_scored)&&Number.isFinite(x.first_half_conceded));return g;};
const homeHalf=venueHalf(a,'home'),awayHalf=venueHalf(b,'away');
const halfAll=[...homeHalf,...awayHalf];
let lambda=null,halfMethod='';
if(homeHalf.length>=2&&awayHalf.length>=2){lambda=(homeHalf.reduce((n,g)=>n+g.first_half_scored+g.first_half_conceded,0)/homeHalf.length+awayHalf.reduce((n,g)=>n+g.first_half_scored+g.first_half_conceded,0)/awayHalf.length)/2;halfMethod='Gerçek ilk yarı verisi';}
else if(halfAll.length>=3){lambda=halfAll.reduce((n,g)=>n+g.first_half_scored+g.first_half_conceded,0)/halfAll.length;halfMethod='Sınırlı ilk yarı verisi';}
else if(valid(a)&&valid(b)){lambda=.45*((a.scored+a.conceded)/a.count+(b.scored+b.conceded)/b.count)/2;halfMethod='Tahmini (90 dk ortalaması)';}
const poissonOver=(l,k)=>l===null?null:100*(1-Math.exp(-l)*Array.from({length:k+1},(_,i)=>{let factorial=1;for(let j=2;j<=i;j++)factorial*=j;return Math.pow(l,i)/factorial;}).reduce((x,y)=>x+y,0));
const fullLambda=valid(a)&&valid(b)?((a.scored+a.conceded)/a.count+(b.scored+b.conceded)/b.count)/2:null;
const halfPanel='<div class="panel"><h3>⏱ İlk Yarı Gol Seçenekleri</h3>'+bar('İY 0,5 Üst',poissonOver(lambda,0))+bar('İY 1,5 Üst',poissonOver(lambda,1))+bar('İY 2,5 Üst',poissonOver(lambda,2))+'<small>'+esc(halfMethod||'Yeterli veri yok')+' · Model puanı</small></div>';
const general='<div class="panel"><h3>🏆 Genel Öneriler</h3>'+bar('1,5 Üst',poissonOver(fullLambda,1))+bar('2,5 Üst',poissonOver(fullLambda,2))+bar('2,5 Alt',fullLambda===null?null:100-poissonOver(fullLambda,2))+'<small>90 dakika gol modeli</small></div>';
const other='<div class="panel"><h3>📋 İlk Yarı Takım Puanları</h3>'+bar('Ev gol atma',pct(a,'home','first_half_scored'))+bar('Dep gol atma',pct(b,'away','first_half_scored'))+bar('Ev gol yeme',pct(a,'home','first_half_conceded'))+bar('Dep gol yeme',pct(b,'away','first_half_conceded'))+'<small>Eksik ilk yarı verisinde tahmini puan kullanılır</small></div>';
const teamPanel='<div class="panel"><h3>📊 Son 5 Maç Performansı</h3>'+[ [r.home,a],[r.away,b] ].map(([name,s])=>'<b>'+esc(name)+'</b>'+metric('Maç sayısı',s?.count??0)+metric('Attığı / yediği gol',valid(s)?s.scored+' / '+s.conceded:'Veri yok')+metric('İlk yarı golü',s?.first_half_count?s.first_half_scored+' / '+s.first_half_conceded:'Veri yok')+(s?.games?.length?'<details><summary>Maçları göster</summary>'+s.games.map(g=>'<p><small>'+esc(g.date)+' · '+esc(g.opponent)+' · '+g.scored+'-'+g.conceded+' · İY '+(g.first_half_scored??'?')+'-'+(g.first_half_conceded??'?')+'</small></p>').join('')+'</details>':'')).join('')+'</div>';
const h2hPanel='<div class="panel"><h3>🔄 Kendi Aralarındaki Maçlar</h3>'+(h?.count?'<small>Ev sahibinin bu rakibe karşı kendi sahasındaki son '+h.count+' doğrulanmış maç</small>'+metric(esc(r.home)+' galibiyet',h.home_wins)+metric('Beraberlik',h.draws)+metric(esc(r.away)+' galibiyet',h.away_wins):'<small>Bu eşleşme için doğrulanmış iç saha karşılaşması bulunamadı (veri kaynağı sınırlı olabilir)</small>')+'</div>';
const avgPanel='<div class="panel"><h3>🏠 Ev / Deplasman Performansı</h3>'+[[r.home,a,'home'],[r.away,b,'away']].map(([name,s,venue])=>{const g=(s?.games||[]).filter(x=>x.venue===venue);return '<b>'+esc(name)+'</b>'+metric('Saha maç sayısı',g.length)+metric('Gol ortalaması',g.length?(g.reduce((n,x)=>n+x.scored,0)/g.length).toFixed(2):'Veri yok');}).join('')+'</div>';
state.innerHTML='<div class="analysis-grid">'+general+halfPanel+other+teamPanel+h2hPanel+avgPanel+'</div><p class="muted"><small>Puanlar istatistiksel model tahminidir; garanti değildir. Gerçek ilk yarı verisi yoksa tahmini hesaplama belirtilir.</small></p>';

}
const fmt=(label,s)=>!s?label+': Veri alınamadı':label+' — Son '+s.count+' maç\nToplam '+s.scored+' gol attı, '+s.conceded+' gol yedi\nİlk yarı '+s.first_half_scored+' attı, '+s.first_half_conceded+' yedi ('+s.first_half_count+' maç)\n'+s.games.map(g=>g.date+' | '+(g.venue==='home'?'Ev':'Deplasman')+' | '+g.opponent+' | '+g.scored+' attı, '+g.conceded+' yedi | İlk yarı '+(g.first_half_scored??'?')+'-'+(g.first_half_conceded??'?')).join('\n');
const h=r.sections?.head_to_head_last10;
const h2h=!h?'İkili rekabet: Veri alınamadı':('İkili rekabet — bulunan son '+h.count+' maç\n'+r.home+' galibiyet: '+h.home_wins+' | Beraberlik: '+h.draws+' | '+r.away+' galibiyet: '+h.away_wins+'\n'+h.games.map(g=>g.date+' | '+r.home+' '+g.home_goals+'-'+g.away_goals+' '+r.away).join('\n'));
el('details').textContent=h2h+'\n\n'+fmt(r.home,r.sections?.home_last5)+'\n\n'+fmt(r.away,r.sections?.away_last5)+'\n\nDiğer analiz alanları henüz tamamlanmadı.';
}catch(e){
if(!results[id]){done++;bad++;}
results[id]={error:e.message};
el('state-'+id).textContent=' ✕ '+e.message;
el('details').textContent=e.message;
}
update();
}

async function analyzeAll(){
const current=++runId;
const queue=[...games];
async function worker(){while(queue.length&&current===runId){const m=queue.shift();await analyze(m.id);}}
await Promise.all(Array.from({length:4},worker));
}

async function send(id){
try{
if(!results[id])await analyze(id);
if(results[id]?.error)throw Error('Hatalı analiz gönderilemez');
await api('/api/telegram',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({match_id:id})
});
alert('Telegram mesajı gönderildi');
}catch(e){alert(e.message);}
}

el('matchDate').value=localDate();
today();
</script>
</body>
</html>
