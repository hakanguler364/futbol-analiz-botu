<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Üyeler · Futbol Analiz</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#101b2c;color:#f0f5ff;font:1rem system-ui}main{width:min(45rem,calc(100% - 2rem));margin:2rem auto}a{color:#b4e0ff}h1{font-size:1.55rem}ul{list-style:none;padding:0}li{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:.6rem 0;padding:.8rem;background:#192b43;border:1px solid #42607c;border-radius:.6rem}button{font:inherit;padding:.5rem;border-radius:.4rem;cursor:pointer}
.online{padding:1rem;background:#192b43;border:1px solid #42607c;border-radius:.6rem}.online p{margin:.4rem 0 0}
</style>
<main>
<a href="/">Analiz merkezine dön</a>
<h1>Üyeler</h1>
<section class="online">
  <strong>Şu an aktif</strong> <span id="onlineCount">Yükleniyor…</span>
  <p>Son 2 dakikada aktif olan üyeler</p>
</section>
<section style="margin:1.5rem 0;padding:1rem;background:#192b43;border:1px solid #42607c;border-radius:.6rem">
<h2>Abonelerin görebileceği analizler</h2>
<p>İşaretli kutular abonelere gösterilir. Ayarlar sunucuya kaydedilir.</p>
<div id="panelChoices"></div>
<button id="savePanels" type="button">Seçimleri kaydet</button>
<p id="panelMessage" role="status"></p>
</section>
<script>
const panels=[['system','Sistem Önerisi'],['teams','Takım analizi'],['goals','Gol analizi'],['averages','Ortalamalar'],['h2h','İkili rekabet'],['venue','İç saha / deplasman'],['halftime','İlk yarı'],['comparison','Karşılaştırma'],['result','Maç sonucu'],['odds','Bahis oranları ve dağılımı']];
async function loadPanels(){
 const response=await fetch('/auth/panels');if(!response.ok)throw Error('Ayarlar alınamadı');
 const data=await response.json();const box=document.querySelector('#panelChoices');box.replaceChildren();
 for(const [id,label] of panels){const row=document.createElement('label');row.style.cssText='display:block;margin:9px 0';const input=document.createElement('input');input.type='checkbox';input.value=id;input.checked=data.enabled.includes(id);row.append(input,' '+label);box.append(row);}
}
document.querySelector('#savePanels').onclick=async()=>{
 const message=document.querySelector('#panelMessage');message.textContent='';
 try{const enabled=[...document.querySelectorAll('#panelChoices input:checked')].map(x=>x.value);
 const response=await fetch('/auth/panels',{method:'POST',headers:{'Content-Type':'application/json','X-Futbol-Request':'1'},body:JSON.stringify({enabled})});
 if(!response.ok)throw Error((await response.json()).error||'Kaydedilemedi');message.textContent='Seçimler kaydedildi.';}
 catch(e){message.textContent=e.message;}
};
loadPanels().catch(e=>document.querySelector('#panelMessage').textContent=e.message);
</script>

<p id="message" role="status"></p>
<ul id="members"></ul>
<dialog id="passwordDialog">
  <form id="passwordForm">
    <h2>Şifreyi sıfırla</h2>
    <p id="passwordMember"></p>
    <label>Yeni şifre
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
    </label>
    <p>En az 12 karakter kullanın. Üyenin açık oturumları kapanır.</p>
    <p id="passwordError" role="status"></p>
    <button type="button" id="cancelPassword">Vazgeç</button>
    <button type="submit" id="savePassword">Şifreyi kaydet</button>
  </form>
</dialog>
</main>
<script>
const list = document.querySelector('#members');
const message = document.querySelector('#message');

async function request(path, options) {
  const response = await fetch(path, options);
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  return result;
}

const passwordDialog = document.querySelector('#passwordDialog');
const passwordForm = document.querySelector('#passwordForm');
const passwordError = document.querySelector('#passwordError');
const savePassword = document.querySelector('#savePassword');
let passwordMemberId;

document.querySelector('#cancelPassword').onclick = () => passwordDialog.close();
passwordDialog.addEventListener('cancel', event => {
  if (savePassword.disabled) event.preventDefault();
});
passwordDialog.addEventListener('close', () => passwordForm.reset());
passwordForm.onsubmit = async event => {
  event.preventDefault();
  passwordError.textContent = '';
  savePassword.disabled = true;
  document.querySelector('#cancelPassword').disabled = true;
  try {
    await request('/auth/access', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Futbol-Request': '1'},
      body: JSON.stringify({
        id: passwordMemberId,
        action: 'reset_password',
        password: document.querySelector('#newPassword').value
      })
    });
    passwordDialog.close();
    message.textContent = 'Şifre değiştirildi ve eski oturumlar kapatıldı.';
  } catch (error) {
    passwordError.textContent = error.message;
  } finally {
    savePassword.disabled = false;
    document.querySelector('#cancelPassword').disabled = false;
  }
};

async function loadMembers() {
  const {members} = await request('/auth/members');
  list.replaceChildren();
  for (const member of members) {
    const row = document.createElement('li');
    const label = document.createElement('span');
    const expired = member.expires_at !== null && member.expires_at * 1000 <= Date.now();
    const status = member.is_admin ? 'Yönetici' : member.blocked ? 'Kapalı' :
      member.pending ? 'Onay bekliyor' : expired ? 'Süresi doldu' : 'Açık';
    label.textContent = (member.display_name ? member.display_name + ' · ' : '') + member.phone + ' · ' + status;
    row.append(label);
    if (!member.is_admin) {
      const action = member.blocked || expired ? 'open' : member.pending ? 'approve' : 'block';
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = {open: 'Aç', approve: 'Onayla', block: 'Engelle'}[action];
      button.onclick = async () => {
        button.disabled = true;
        message.textContent = '';
        try {
          await request('/auth/access', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Futbol-Request': '1'},
            body: JSON.stringify({id: member.id, action})
          });
          await loadMembers();
          message.textContent = 'Üye durumu güncellendi.';
        } catch (error) {
          message.textContent = error.message;
          button.disabled = false;
        }
      };
      const reset = document.createElement('button');
      reset.type = 'button';
      reset.textContent = 'Şifreyi sıfırla';
      reset.onclick = () => {
        passwordMemberId = member.id;
        document.querySelector('#passwordMember').textContent = member.phone;
        passwordError.textContent = '';
        passwordDialog.showModal();
      };
      row.append(button, reset);
    }
    list.append(row);
  }
}

async function refreshOnline() {
  const counter = document.querySelector('#onlineCount');
  try {
    const {count} = await request('/auth/online');
    counter.textContent = count;
  } catch {
    counter.textContent = 'Sayı alınamadı';
  }
}
refreshOnline();
setInterval(refreshOnline, 15000);

loadMembers().catch(error => {message.textContent = error.message;});
</script>
</html>
